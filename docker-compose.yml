version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fgc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-fgc_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fgc_password}
      POSTGRES_DB: ${DB_NAME:-fgc_dev}
    ports:
      - '5432:5432'
    volumes:
      - fgc_postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-fgc_user} -d ${DB_NAME:-fgc_dev}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fgc_postgres_data:
